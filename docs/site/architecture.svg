<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SlidePoise architecture</title><desc id="desc">The Agent plans slide content from a brief and source files. Retrieval selects visual references, Remix icons, logos and native components for image generation. The generated design is interpreted by the Agent and measured with OpenCV. Their semantic map and geometry combine with original assets in the PowerPoint build. The Agent compares the rendered PowerPoint with the generated design and revises affected stages.</desc><defs><marker id="stone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#817362" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8f734b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="graphite-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#716e69" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="sage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#647468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mauve-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#7c6876" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#faf9f6" stroke="none"/><text x="64" y="62" font-family="Arial" font-size="28" fill="#292824" >SlidePoise</text><text x="1536" y="60" font-family="Arial" font-size="12" fill="#827b70" letter-spacing="1.4" text-anchor="end">ARCHITECTURE</text><text x="64" y="124" font-family="Arial" font-size="13" fill="#827b70" >01</text><text x="94" y="125" font-family="Arial" font-size="23" fill="#292824" >Content planning</text><path d="M64 145h240" fill="none" stroke="#ded9cf"/><text x="368" y="124" font-family="Arial" font-size="13" fill="#827b70" >02</text><text x="398" y="125" font-family="Arial" font-size="23" fill="#292824" >Visual design</text><path d="M368 145h336" fill="none" stroke="#ded9cf"/><text x="768" y="124" font-family="Arial" font-size="13" fill="#827b70" >03</text><text x="798" y="125" font-family="Arial" font-size="23" fill="#292824" >Reconstruction</text><path d="M768 145h432" fill="none" stroke="#ded9cf"/><text x="1264" y="124" font-family="Arial" font-size="13" fill="#827b70" >04</text><text x="1294" y="125" font-family="Arial" font-size="23" fill="#292824" >Review</text><path d="M1264 145h272" fill="none" stroke="#ded9cf"/><rect x="64" y="203" width="240" height="88" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="84" y="254" font-family="Arial" font-size="21" fill="#292824" >Brief and source files</text><path d="M184 293L184 355" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="64" y="364" width="240" height="112" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="84" y="408" font-family="Arial" font-size="21" fill="#292824" >Plan slide content</text><text x="84" y="441" font-family="Arial" font-size="16" fill="#827b70" >Agent</text><path d="M306 419L360 419" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><text x="84" y="509" font-family="Arial" font-size="16" fill="#827b70" >Slide plan</text><rect x="368" y="182" width="336" height="111" rx="4" fill="#f1eeeb" stroke="#dcd9d1"/><text x="388" y="214" font-family="Arial" font-size="18" fill="#292824" >Visual reference index</text><text x="388" y="244" font-family="Arial" font-size="18" fill="#292824" >Remix icons and exact logos</text><text x="388" y="274" font-family="Arial" font-size="18" fill="#292824" >Native component previews</text><path d="M436 295L436 355" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="368" y="364" width="136" height="112" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="388" y="408" font-family="Arial" font-size="21" fill="#292824" >Retrieve</text><text x="388" y="441" font-family="Arial" font-size="16" fill="#827b70" >Assets</text><path d="M508 419L554 419" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="560" y="364" width="144" height="112" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="580" y="408" font-family="Arial" font-size="21" fill="#292824" >Generate</text><text x="580" y="441" font-family="Arial" font-size="16" fill="#827b70" >Image model</text><text x="580" y="509" font-family="Arial" font-size="16" fill="#827b70" >Slide image</text><path d="M706 419L760 419" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="768" y="364" width="188" height="112" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="788" y="408" font-family="Arial" font-size="21" fill="#292824" >Interpret</text><text x="788" y="441" font-family="Arial" font-size="16" fill="#827b70" >Agent</text><rect x="1012" y="364" width="188" height="112" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1032" y="408" font-family="Arial" font-size="21" fill="#292824" >Measure</text><text x="1032" y="441" font-family="Arial" font-size="16" fill="#827b70" >OpenCV</text><path d="M964 411h38" fill="none" stroke="#647468" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><path d="M971 406l-7 5 7 5M995 406l7 5-7 5" fill="none" stroke="#647468" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><text x="785" y="510" font-family="Arial" font-size="16" fill="#827b70" >Semantic map</text><text x="1052" y="510" font-family="Arial" font-size="16" fill="#827b70" >Geometry</text><path d="M861 519v38h246v-38" fill="none" stroke="#647468" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><path d="M984 557L984 586" fill="none" stroke="#647468" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#sage-arrow)"/><rect x="768" y="596" width="432" height="106" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="788" y="637" font-family="Arial" font-size="21" fill="#292824" >Build PowerPoint</text><text x="788" y="670" font-family="Arial" font-size="16" fill="#827b70" >Reconstruction compiler + PptxGenJS</text><path d="M436 477v279h550v-47" fill="none" stroke="#7c6876" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#mauve-arrow)"/><rect x="482" y="735" width="352" height="25" rx="0" fill="#faf9f6" stroke="none"/><text x="488" y="753" font-family="Arial" font-size="15" fill="#817362" >Original assets and component definitions</text><rect x="1264" y="364" width="272" height="88" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1284" y="396" font-family="Arial" font-size="21" fill="#292824" >Target design</text><text x="1284" y="429" font-family="Arial" font-size="16" fill="#827b70" >Generated slide image</text><path d="M632 363v-39h768v32" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M1204 648L1256 648" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="1199" y="610" width="52" height="25" rx="0" fill="#faf9f6" stroke="none"/><text x="1205" y="628" font-family="Arial" font-size="15" fill="#817362" >PPTX</text><rect x="1264" y="596" width="272" height="106" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1284" y="637" font-family="Arial" font-size="21" fill="#292824" >Render PowerPoint</text><text x="1284" y="670" font-family="Arial" font-size="16" fill="#827b70" >LibreOffice or host renderer</text><path d="M1538 409h16v364h-12" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M1400 704L1400 720" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="1264" y="729" width="272" height="87" rx="4" fill="#ecefe9" stroke="#d6ddd2"/><text x="1284" y="762" font-family="Arial" font-size="21" fill="#292824" >Compare and revise</text><text x="1284" y="793" font-family="Arial" font-size="15" fill="#827b70" >Agent reviews the actual render</text><text x="1400" y="868" font-family="Arial" font-size="20" fill="#292824" text-anchor="middle">Editable PowerPoint</text><path d="M1400 819L1400 840" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M1256 774H1220v63H184V483" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#stone-arrow)"/><path d="M1136 837v-128" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#stone-arrow)"/><rect x="414" y="818" width="234" height="25" rx="0" fill="#faf9f6" stroke="none"/><text x="420" y="836" font-family="Arial" font-size="15" fill="#817362" >Revisions to affected stages</text></svg>